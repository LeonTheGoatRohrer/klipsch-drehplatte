[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
platform_packages =
  toolchain-riscv32-esp @ file://.pio/toolchain-staging
monitor_speed = 115200
monitor_eol = LF
upload_port = COM7
monitor_port = COM7
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<ap_probe.cpp>

[env:esp32c3-probe]
extends = env:esp32c3
build_src_filter = +<ap_probe.cpp> -<main.cpp>
